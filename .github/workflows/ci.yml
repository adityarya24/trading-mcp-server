name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[pdf,dev]"

      - name: Ruff
        run: ruff check market services

      - name: Pytest
        run: pytest -q --cov=market --cov=services --cov-report=term-missing
        env:
          TRADING_PDF_RENDERER: reportlab